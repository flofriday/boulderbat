[project]
name = "boulderbat"
version = "0.1.0"
description = "Boulderbar capacity tracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "apscheduler>=3.10",
    "aiosqlite>=0.20",
    "aiofiles>=24.0",
    "numpy>=2.2",
    "timestral",
    "torch>=2.4",
]

[tool.uv.sources]
timestral = { git = "https://github.com/mistralai/timestral.git", rev = "a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff" }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
